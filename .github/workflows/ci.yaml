name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install nightly-2026-08-15 --profile minimal
      # The hosted runner's virtual GPU does not support Metal 4.
      - name: Build tests with KosmicKrisp
        run: cargo +nightly-2026-08-15 test --locked --features half --lib --example two_sum --no-run
