[package]
name = "krnl-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
half = ["dep:half", "num-synth/half"]

[dependencies]
half = { version = "=2.3.1", default-features = false, optional = true }
libm = { version = "=0.2.8", default-features = false, optional = true }
krnl = { git = "https://github.com/jlogan03/krnl", branch = "jlogan/kosmickrisp" }
num-synth = { git = "https://github.com/jlogan03/num-synth", branch = "main" }
deimos_numerics = { git = "https://github.com/deimoscontrols/deimos", branch = "main", default-features = false }

[dev-dependencies]
rand = "0.9"
rayon = "1.12"
num_cpus = "1.17"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
kosmickrisp-static = { git = "https://github.com/jlogan03/kosmickrisp-static", rev = "2435236d1e1dafa63a400b3bec68f1e8d5de79d6" }

[package.metadata.krnlc]
features = ["half"]

[package.metadata.krnlc.dependencies]
# Share these dependencies with krnlc to preserve compatible versions.
half = {}
libm = {}
deimos_numerics = {}
num-synth = { features = ["half"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_arch, values("spirv"))',
    'cfg(krnlc)',
] }
